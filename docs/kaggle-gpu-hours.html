<!--
Author: Claude Opus 5.5 (Bubba)
Date: 09-October-2026
PURPOSE: "Kaggle GPU hours" page for the team (the Boss, #arc-3, 9-Oct-2026). Shows the weekly Kaggle GPU quota
  of the three ARC Prize team accounts (markbarney = the Boss, sonphamorg = Son, scizical = Ronen): hours used and
  left this week, the refresh time, what is running, the submission reserve (one version run plus one scoring run;
  scoring bills the weekly quota) and whether it is at risk, hours that will expire unused at the refresh, and a
  trend from the tracker's history.
  Data: GET /api/v1/rl2/doc/kaggle-gpu-hours, a sanitized snapshot (numbers, times, kernel titles, flags; no
  credentials) that Bubba's tracker on the Mac Mini (~/bubba-workspace/tools/kaggle/kaggle_gpu_hours.py) PUTs to
  /api/v1/rl2/publication/kaggle-gpu-hours with ARC3_PUBLISH_TOKEN on every run (every 8 hours). The snapshot's age
  is shown at the top and turns into a warning once it is older than one tracker cycle, so stale data is obvious.
  The page itself never talks to Kaggle and holds no secret.
SRP/DRY check: Pass - reuses the site's named-document store (same route as climb.js's score-climb), theme.css, the
  site tab strip and usage.html's inline-SVG chart style; no new server code.
-->

<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 0 20px 60px; height: auto; overflow: auto; }
  .sitetabs { display: flex; gap: 6px; align-items: center; margin: 0 -20px 28px; padding: 10px 20px;
              border-bottom: 1px solid var(--wash-line); font-size: 13px; flex-wrap: wrap; }
  .sitetabs a { padding: 7px 16px; border-radius: 8px; text-decoration: none; color: inherit;

  td.num, th.num { text-align: right; }

  .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--muted); border-radius: 2px 0 0 2px; }

<div class="wrap">
  <h1>Kaggle GPU hours</h1>
  <p class="sub">Weekly Kaggle GPU quota on the three team accounts, read from Kaggle's own quota API by Bubba's tracker every eight hours.</p>
  <p class="meta" id="meta">Loading…</p>
  <div id="body"></div>
</div>
<script>
const DOC = "/api/v1/rl2/doc/kaggle-gpu-hours";
const STALE_H = 9;   // the tracker runs every 8 hours; older than this means a run was missed
const COLORS = ["--accent", "--ok", "--purple"];
const body = document.querySelector("#body");
const meta = document.querySelector("#meta");

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function h(x) { return x == null ? "—" : `${Number(x).toFixed(1)} h`; }
function ago(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return `${m} min ago`;
  const hrs = m / 60;
  return hrs < 48 ? `${hrs.toFixed(1)} hours ago` : `${(hrs / 24).toFixed(1)} days ago`;
}
function until(ms) {
  const hrs = ms / 3600000;
  if (hrs <= 0) return "passed";
  return hrs < 1 ? `in ${Math.round(hrs * 60)} min` : hrs < 48 ? `in ${hrs.toFixed(1)} hours` : `in ${(hrs / 24).toFixed(1)} days`;
}
function local(iso) {
  return new Date(iso).toLocaleString(undefined, {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZoneName: "short"});
}

// Hours left minus what live sessions hold, measured against the reserve. Recomputed in the browser only to label
// the risk; the flags themselves come from the tracker.
function reserveText(a) {
  if (!a.reserve_h) return '<span class="ok">no reserve (experiment account)</span>';
  const free = (a.left_h ?? 0) - (a.held_h ?? 0);
  const gap = free - a.reserve_h;
  const why = `${h(a.reserve_h)} = one ${h(a.run_h)} version run + one ${h(a.run_h)} scoring run`;
  return gap < 0
    ? `<b style="color:var(--err)">at risk</b>, ${h(-gap)} short<div class="note">${why}</div>`
    : `covered, ${h(gap)} to spare<div class="note">${why}</div>`;
}

function accountRows(doc, now) {
  return doc.accounts.map(a => {
    const flags = (a.flags || []).map(f => `<span class="flag ${esc(f)}">${esc(f.replace("_", " ").toLowerCase())}</span>`).join("") || '<span class="ok">none</span>';
    if (a.reason) {
      return `<tr><td><b>${esc(a.user)}</b><div class="who">${esc(a.who)}</div></td>
        <td colspan="5">No access: ${esc(a.reason)}</td><td>${flags}</td></tr>`;
    }
    const allowed = a.allowed_h || 1;
    const usedPct = Math.min(100, (a.used_h / allowed) * 100);
    const resPos = Math.max(0, Math.min(100, ((allowed - a.reserve_h) / allowed) * 100));
    const live = (a.live || []).length
      ? (a.live).map(k => `<div class="live">${esc(k.title)} <span>${esc(k.status)}</span></div>`).join("")
      : '<span class="ok">nothing</span>';
    return `<tr>
      <td><b>${esc(a.user)}</b><div class="who">${esc(a.who)}</div></td>
      <td>${h(a.used_h)} used of ${h(a.allowed_h)}
        <div class="bar"><i style="width:${usedPct.toFixed(1)}%"></i>${a.reserve_h ? `<b style="left:${resPos.toFixed(1)}%" title="reserve starts here"></b>` : ""}</div>
        <div class="barlab">${a.reserve_h ? "orange mark: the reserve starts here" : ""}</div></td>
      <td class="num"><b>${h(a.left_h)}</b>${a.held_h ? `<div class="note">${h(a.held_h)} held by live sessions</div>` : ""}</td>
      <td class="num">${h(a.spendable_h)}</td>
      <td>${reserveText(a)}</td>
      <td>${live}</td>
      <td>${flags}</td>
    </tr>`;
  }).join("");
}

// Hours that will be lost at the refresh: whatever is left and not held by a live session. Called out when the
// refresh is inside the tracker's expire window.
function expiring(doc, now) {
  const items = doc.accounts.filter(a => !a.reason).map(a => {
    const refresh = new Date(a.refresh_utc).getTime();
    const lost = Math.max(0, (a.left_h ?? 0) - (a.held_h ?? 0));
    return {a, refresh, lost};
  });
  const soon = items.filter(x => x.refresh - now < doc.expire_window_h * 3600000 && x.refresh > now && x.lost > 0.05);
  if (!soon.length) return `<p class="ok">Nothing is due to expire in the next ${doc.expire_window_h} hours.</p>`;
  return `<ul class="plain">${soon.map(x =>
    `<li><b>${h(x.lost)}</b> on ${esc(x.a.user)} (${esc(x.a.who)}) expire unused at the refresh, ${until(x.refresh - now)}${(x.a.live || []).length ? ", unless the running session uses them" : ""}.</li>`).join("")}</ul>`;
}

// Hours used over time, one line per account, on a fixed 0..allowance scale. Each weekly refresh shows as a drop.
function trend(doc) {
  const hist = (doc.history || []).filter(r => r.used_h != null);
  const users = doc.accounts.map(a => a.user);
  if (!hist.length) return '<p class="ok">No history yet.</p>';
  const times = hist.map(r => new Date(r.at).getTime());
  const t0 = Math.min(...times), t1 = Math.max(...times);
  const yMax = Math.max(30, ...hist.map(r => r.allowed_h || 0));
  const W = 1000, H = 180, padL = 26, padR = 8, padT = 8, padB = 18;
  const X = t => t1 === t0 ? (padL + W - padR) / 2 : padL + ((t - t0) / (t1 - t0)) * (W - padL - padR);
  const Y = v => padT + (1 - Math.min(v, yMax) / yMax) * (H - padT - padB);
  let grid = "";
  for (const f of [0, 0.5, 1]) {
    const y = Y(yMax * f);
    grid += `<line class="grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/><text class="axis" x="0" y="${y + 3}">${(yMax * f).toFixed(0)}h</text>`;
  }
  const fmt = t => new Date(t).toLocaleString(undefined, {month: "short", day: "numeric", hour: "2-digit"});
  grid += `<text class="axis" x="${padL}" y="${H - 4}">${fmt(t0)}</text>`;
  if (t1 !== t0) grid += `<text class="axis" x="${W - padR}" y="${H - 4}" text-anchor="end">${fmt(t1)}</text>`;
  let marks = "", legend = "";
  users.forEach((u, i) => {
    const c = css(COLORS[i % COLORS.length]);
    const pts = hist.filter(r => r.user === u).map(r => [X(new Date(r.at).getTime()), Y(r.used_h), r]);
    if (!pts.length) return;
    if (pts.length > 1) marks += `<polyline points="${pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
    marks += pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${c}"><title>${esc(u)} ${fmt(new Date(p[2].at).getTime())}: ${h(p[2].used_h)} used, ${h(p[2].left_h)} left</title></circle>`).join("");
    const acct = doc.accounts.find(a => a.user === u);
    legend += `<span><i style="background:${c}"></i>${esc(u)} (${esc(acct ? acct.who : "")})</span>`;
  });
  const days = Math.max(1, Math.round((t1 - t0) / 86400000));
  return `<div class="legend">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${marks}</svg>
    <p class="note">Hours used this week at each tracker run${t1 - t0 < 7 * 86400000 ? " (history started 9 October, so there is less than a week of it)" : ""}; the line drops back at each weekly refresh. Last ${days} day${days === 1 ? "" : "s"} of up to ${doc.history_days}.</p>`;
}

function render(doc) {
  const now = Date.now();
  const age = now - new Date(doc.generated_at).getTime();
  const stale = age > STALE_H * 3600000;
  const refreshes = [...new Set(doc.accounts.filter(a => a.refresh_utc).map(a => a.refresh_utc))];
  meta.innerHTML = `Snapshot taken <b>${local(doc.generated_at)}</b>, `
    + (stale ? `<span class="stale">${ago(age)}: stale, the tracker has missed a run</span>` : `<b>${ago(age)}</b>`)
    + (refreshes.length ? ` · weekly refresh <b>${refreshes.map(local).join(", ")}</b> (${until(new Date(refreshes[0]).getTime() - now)})` : "");
  body.innerHTML = `
    <div class="section"><h2>This week, per account</h2>
      <table><thead><tr><th>Account</th><th>Used</th><th class="num">Left</th><th class="num">Spendable now</th>
        <th>Submission reserve</th><th>Running</th><th>Flags</th></tr></thead>
        <tbody>${accountRows(doc, now)}</tbody></table>
      <p class="note">Spendable now = hours left, minus hours held by live sessions, minus the submission reserve. A submission costs two runs on the submitting account's weekly quota: the version run and the scoring run.</p>
    </div>
    <div class="section"><h2>About to expire unused</h2>${expiring(doc, now)}</div>
    <div class="section"><h2>Trend</h2>${trend(doc)}</div>`;
}

fetch(DOC, {cache: "no-store", credentials: "same-origin", redirect: "manual"})
  .then(r => { if (!r.ok) throw new Error(r.status === 404 ? "Nothing published yet." : `The site answered ${r.status || "with a redirect (sign in again)"}.`); return r.json(); })
  .then(render)
  .catch(e => { meta.textContent = ""; body.innerHTML = `<div class="empty">No GPU hours snapshot. ${esc(e.message)}</div>`; });
</script>
</body>
</html>
