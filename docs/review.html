<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trace review · ARC-3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./static/css/theme.css?v=20260823-scroll">
<link rel="stylesheet" href="./static/css/rl-shell.css?v=20261002-solid">
<link rel="stylesheet" href="./static/css/review.css?v=20261003-compact">
<script>
(function(){try{var t=localStorage.getItem('arc3-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" type="image/png" href="./static/img/games/sp80-589a99af.png">
<script defer src="./static/js/theme-toggle.js?v=20260826-overlay"></script>
<script type="module" src="./static/js/review.js?v=20261003-compact"></script>
</head>
<body class="rv-page">
<nav class="sitetabs" aria-label="Site">
  <a href="./">Games</a>
  <a href="./research.html">Research</a>
  <a href="./internal.html">Internal runs</a>
  <a href="./climb.html">Score climb</a>
  <a href="./rl.html">RL</a>
  <a href="./rl2.html">RL2</a>
  <a href="./review.html" class="active">Trace review</a>
  <a href="./tree.html">Tree</a>
  <span class="rv-who" id="who" style="margin-left:auto"></span>
  <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme"></button>
</nav>


<main class="rv">

  <div class="rv-banner" id="banner" hidden></div>
  <section class="rv-team" id="team" hidden></section>

  <div class="rv-head" id="deck" hidden>
    <section class="rv-context" id="context"></section>
    <div class="rv-verdict" id="verdict">
      <div class="rv-vrow">
        <div class="rv-choices" id="choices"></div>
        <div class="rv-conf" id="conf">
          <span class="muted">how sure</span>
          <button type="button" data-conf="1">unsure</button>
          <button type="button" data-conf="2">fairly</button>
          <button type="button" data-conf="3">very</button>
        </div>
      </div>
      <div class="rv-vrow">
        <input class="rv-comment" id="comment" maxlength="4000" placeholder="One line on why (optional, but it is the most useful part)">
        <div class="rv-act">
          <button type="button" class="rv-submit" id="submit" disabled>Submit · next <kbd>Enter</kbd></button>
          <button type="button" class="rv-skip" id="skip">Skip</button>
        </div>
      </div>
    </div>
  </div>
  <section class="rv-options" id="options"></section>
  <div class="rv-empty" id="empty" hidden></div>
</main>
<div class="rv-toast" id="toast" hidden></div>
</body>
</html>
