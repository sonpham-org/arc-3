<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC3 score over time</title>
  <link rel="stylesheet" href="./static/css/theme.css?v=20260823-scroll">
  <link rel="stylesheet" href="./static/css/trace.css?v=20260819-score-time">
  <link rel="stylesheet" href="./static/css/score-time.css?v=20260819-score-time">
  <script>
  (function(){try{var t=localStorage.getItem('arc3-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <script defer src="./static/js/theme-toggle.js"></script>
</head>
<body>
  <nav class="sitetabs">
    <a href="./">Games</a>
    <a href="./internal.html" class="active">Internal runs</a>
  </nav>
  <nav class="runtabs">
    <a class="rt-home" href="./internal.html">&larr; runs</a>
    <a class="rt-tab" id="rt-viewer">Viewer</a>
    <a class="rt-tab" id="rt-trace">Execution trace</a>
    <a class="rt-tab active" id="rt-score">Score over time</a>
    <button data-theme-toggle class="theme-toggle" style="margin-left:auto;align-self:center"></button>
  </nav>

  <main class="score-shell">
    <header class="score-head">
      <div>
        <h1 id="score-run">Score over time</h1>
        <p>Mean ARC3 score across the full game panel, reconstructed at every timestamped level completion.</p>
      </div>
      <select id="run-select" class="run-picker" aria-label="Run"></select>
    </header>
    <section class="stat-grid" id="score-stats" aria-label="Score summary"></section>
    <section class="score-panel">
      <div class="score-panel-head"><b>Mean score trajectory</b><span id="score-note"></span></div>
      <div class="score-chart" id="score-chart"></div>
      <div class="score-tooltip" id="score-tooltip" hidden></div>
    </section>
    <section class="completion-panel">
      <div class="score-panel-head"><b>Scoring events</b><span id="completion-count"></span></div>
      <div class="completion-table-wrap">
        <table class="completion-table">
          <thead><tr><th>Runtime</th><th>UTC</th><th>Game</th><th>Level</th><th>Action</th><th>Mean score</th><th>Timestamp basis</th></tr></thead>
          <tbody id="completion-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="./static/js/score-time.js?v=20260822-postgres-catalog-v1"></script>
</body>
</html>
