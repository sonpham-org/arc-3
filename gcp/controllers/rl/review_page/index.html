<title>ARC3 Fork Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #17202c;
  --muted: #5a6677;
  --line: #d6dce5;
  --accent: #0b6fd0;
  --accent-soft: #e2effc;
  --good: #1f7a33;
  --good-soft: #e3f3e6;
  --warn: #a2520a;
  --warn-soft: #fbeedd;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --stage: #0f1520;
  --font: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --surface-2: #1a2330; --ink: #e5eaf1; --muted: #93a0b3; --line: #273243;
    --accent: #5aaeff; --accent-soft: #15304d; --good: #6fd08a; --good-soft: #163423; --warn: #f0a85a;
    --warn-soft: #3a2812; --bad: #ff8a80; --bad-soft: #3d1a18; --stage: #06090e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --surface-2: #1a2330; --ink: #e5eaf1; --muted: #93a0b3; --line: #273243;
  --accent: #5aaeff; --accent-soft: #15304d; --good: #6fd08a; --good-soft: #163423; --warn: #f0a85a;
  --warn-soft: #3a2812; --bad: #ff8a80; --bad-soft: #3d1a18; --stage: #06090e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 24px; display: flex;
  flex-direction: column; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.who { font-size: 12px; color: var(--muted); padding: 0 4px; }
.filters { display: flex; gap: 6px; padding: 0 4px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px;
  font-size: 12px; color: var(--muted); }
.chipbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.queue button { width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px;
  padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.queue button:hover { background: var(--surface-2); }
.queue button[aria-current="true"] { background: var(--accent-soft); border-color: transparent; }
.q-game { font-family: var(--mono); font-weight: 500; }
.q-meta { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.q-state { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; align-self: center; }
.q-state.done { color: var(--good); }
.q-state.todo { color: var(--muted); }
.mobile-pick { display: none; }

main { padding-block: 22px 40px; padding-inline: 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.headline h2 { margin: 0; font-size: 22px; letter-spacing: -0.015em; font-weight: 700; }
.headline .sub { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.panel h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.path { display: grid; grid-template-columns: minmax(240px, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { background: var(--stage); border-radius: 10px; padding: 10px; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; }
.stage canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; border-radius: 3px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.iconbtn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2);
  display: inline-grid; place-items: center; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 16px; height: 16px; fill: currentColor; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; margin-left: auto; }
.timeline { margin-top: 12px; position: relative; }
.timeline input[type="range"] { width: 100%; accent-color: var(--accent); }
.ticks { position: relative; height: 14px; margin-top: -2px; }
.tick { position: absolute; top: 0; width: 2px; height: 10px; background: var(--muted); border-radius: 1px; transform: translateX(-1px); }
.tick.fork { background: var(--accent); height: 14px; width: 3px; }
.tick-label { position: absolute; top: 12px; font-size: 10.5px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.readout { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 16px; font-size: 13px; }
.readout b { font-weight: 600; }
.think { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.think .label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.think pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 var(--mono); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 300px; overflow: auto; }
.think .hint { color: var(--muted); font-size: 12.5px; }

.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px; display: flex;
  flex-direction: column; gap: 8px; position: relative; }
.card.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.picked { background: var(--accent-soft); }
.card .mini { background: var(--stage); border-radius: 7px; padding: 5px; aspect-ratio: 1 / 1; max-width: 100%; border: 0; width: 100%; }
.card .mini canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.card-name { font-weight: 600; }
.card-sub { font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.src { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.card-actions { display: flex; gap: 6px; }
.card-actions .btn { flex: 1; padding: 5px 8px; font-size: 12.5px; }
.card-actions .btn[aria-pressed="true"].pick { background: var(--accent); color: #fff; border-color: transparent; }
.card-actions .btn[aria-pressed="true"].flag { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tally { font-size: 12px; color: var(--accent); font-weight: 600; min-height: 1em; }

.decide { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: end; }
.decide textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); padding: 10px; }
.decide .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 12.5px; color: var(--muted); }
.status.err { color: var(--bad); }
.status.ok { color: var(--good); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.keys { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: 16px; }
  .queue, .filters { display: none; }
  .mobile-pick { display: block; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
  main { padding-inline: 16px; }
  .path { grid-template-columns: 1fr; }
  .decide { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <aside class="rail" aria-label="Moments to review">
    <div class="brand">
      <h1>ARC3 Fork Review</h1>
      <p>Pick the best way forward from a moment where the model sometimes plays well.</p>
    </div>
    <div class="who" id="who">Loading reviewer…</div>
    <div class="filters" role="group" aria-label="Filter">
      <button class="chipbtn" id="f-todo" aria-pressed="true">Needs my pick</button>
      <button class="chipbtn" id="f-all" aria-pressed="false">All</button>
    </div>
    <select class="mobile-pick" id="mobile-pick" aria-label="Moment"></select>
    <ul class="queue" id="queue"></ul>
  </aside>

  <main id="main">
    <div class="empty" id="loading">Loading moments…</div>
  </main>
</div>

<template id="tpl-moment">
  <div class="headline">
    <h2><span class="mono" data-f="game"></span> · level <span data-f="level"></span></h2>
    <span class="sub" data-f="sub"></span>
  </div>

  <section class="panel" aria-labelledby="h-path">
    <h3 id="h-path">How the model got here</h3>
    <div class="path">
      <div>
        <div class="stage"><canvas id="big" width="512" height="512" aria-label="Game frame"></canvas></div>
        <div class="controls">
          <button class="iconbtn" id="b-start" title="Back to the level start" aria-label="Back to the level start"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
          <button class="iconbtn" id="b-prev" title="One action back (←)" aria-label="One action back"><svg viewBox="0 0 16 16"><path d="M11 2v12L3 8z"/></svg></button>
          <button class="iconbtn" id="b-play" title="Replay (space)" aria-label="Replay"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></button>
          <button class="iconbtn" id="b-next" title="One action forward (→)" aria-label="One action forward"><svg viewBox="0 0 16 16"><path d="M5 2v12l8-6z"/></svg></button>
          <button class="iconbtn" id="b-end" title="Jump to the end" aria-label="Jump to the end"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
          <label class="toggle"><input type="checkbox" id="from-start"> Replay from game start</label>
        </div>
        <div class="timeline">
          <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scroll through the actions">
          <div class="ticks" id="ticks"></div>
        </div>
        <div class="readout" id="readout"></div>
      </div>
      <div class="think">
        <div class="label" id="think-label">Model's thinking at this point</div>
        <pre id="think-first"></pre>
        <div class="label" id="think-last-label" hidden>Later in the same turn</div>
        <pre id="think-last" hidden></pre>
        <div class="keys"><span><span class="kbd">space</span> replay</span><span><span class="kbd">←</span> <span class="kbd">→</span> step</span><span><span class="kbd">1</span>–<span class="kbd">9</span> show a try</span><span><span class="kbd">p</span> pick it</span></div>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-cands">
    <h3 id="h-cands">Tries from this moment</h3>
    <div class="row" style="display:flex;gap:8px;margin:-4px 0 12px;align-items:center;flex-wrap:wrap">
      <button class="btn" id="b-playall">Play all tries</button>
      <span class="status" id="cands-note">Click a try to watch it in the big frame. Each one starts from the same frame.</span>
    </div>
    <div class="cands" id="cands"></div>
  </section>

  <section class="panel" aria-labelledby="h-decide">
    <h3 id="h-decide">Your pick</h3>
    <div class="decide">
      <div>
        <label for="note" class="status">Why (optional): what made it better, or what the others got wrong</label>
        <textarea id="note" placeholder="e.g. Try 3 tests the switch once, then commits. The others keep pacing."></textarea>
      </div>
      <div class="row">
        <button class="btn" id="b-none" aria-pressed="false">None is good</button>
        <button class="btn primary" id="b-save" disabled>Save pick</button>
      </div>
    </div>
    <div class="status" id="save-status" style="margin-top:10px"></div>
  </section>
</template>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const state = { index: [], cache: new Map(), cur: null, focus: -1, pos: 0, playing: null, minis: null,
    db: null, uid: null, labels: new Map(), mine: new Map(), filter: "todo", pick: null, flags: new Set(),
    writable: true, dirty: false };

  // ---------------------------------------------------------------- frames
  function decode(list, prev) {
    const out = [];
    let cur = prev ? prev.slice() : null, w = prev ? prev.w : 64;
    for (const f of list) {
      if (f[0] === "F") {
        const k = f.indexOf(":");
        const [fw, fh] = f.slice(1, k).split(",").map(Number);
        cur = new Uint8Array(fw * fh); w = fw;
        for (let i = 0; i < cur.length; i++) cur[i] = parseInt(f[k + 1 + i], 16);
      } else {
        cur = cur.slice();
        for (let i = 1; i < f.length; i += 4) cur[parseInt(f.substr(i, 3), 16)] = parseInt(f[i + 3], 16);
      }
      cur.w = w; out.push(cur);
    }
    return out;
  }
  function rgb(hex) { const n = parseInt(hex.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function painter(canvas, palette) {
    const ctx = canvas.getContext("2d");
    const off = document.createElement("canvas");
    const octx = off.getContext("2d");
    const pal = palette.map(rgb);
    return frame => {
      if (!frame) return;
      const w = frame.w, h = frame.length / w;
      if (off.width !== w || off.height !== h) { off.width = w; off.height = h; }
      const img = octx.createImageData(w, h);
      for (let i = 0; i < frame.length; i++) {
        const c = pal[frame[i]] || [0, 0, 0];
        img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
      }
      octx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    };
  }

  // ---------------------------------------------------------------- data
  async function loadIndex() {
    const r = await fetch("data/index.json", { cache: "no-store" });
    if (!r.ok) throw new Error("index " + r.status);
    return (await r.json()).moments || [];
  }
  async function loadMoment(id) {
    if (state.cache.has(id)) return state.cache.get(id);
    const r = await fetch(`data/${encodeURIComponent(id)}.json`, { cache: "no-store" });
    if (!r.ok) throw new Error("moment " + r.status);
    const m = await r.json();
    m.pf = decode(m.prefix.frames);
    const fork = m.pf[m.pf.length - 1];
    m.candidates.forEach((c, i) => {
      c.fr = decode(c.frames, fork);
      c.label = c.kind === "source" ? "First run" : `Try ${m.candidates.filter((x, j) => x.kind === "try" && j <= i).length}`;
    });
    state.cache.set(id, m);
    return m;
  }

  // ---------------------------------------------------------------- queue
  function labelKey(mid, uid) { return `${mid}~${uid}`.replace(/[^A-Za-z0-9_.~:@+-]/g, "_").slice(0, 190); }
  function renderQueue() {
    const q = $("#queue"), sel = $("#mobile-pick");
    q.textContent = ""; sel.textContent = "";
    const rows = state.index.filter(m => state.filter === "all" || !state.mine.has(m.id));
    if (!rows.length) {
      const li = document.createElement("li");
      li.className = "status"; li.style.padding = "8px 10px";
      li.textContent = state.filter === "todo" ? "You have picked every moment. Switch to All to revisit." : "No moments yet.";
      q.append(li);
    }
    for (const m of rows) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.setAttribute("aria-current", state.cur && state.cur.id === m.id ? "true" : "false");
      const g = document.createElement("span"); g.className = "q-game"; g.textContent = `${m.game} · L${m.level}`;
      const s = document.createElement("span"); s.className = "q-state " + (state.mine.has(m.id) ? "done" : "todo");
      s.textContent = state.mine.has(m.id) ? "Picked" : "Open";
      const meta = document.createElement("span"); meta.className = "q-meta";
      meta.textContent = `${m.tries} tries · ${m.cleared} cleared` + (m.best ? ` · best ${m.best} actions` : "") +
        (m.human ? ` · human ${m.human}` : "");
      b.append(g, s, meta);
      b.addEventListener("click", () => openMoment(m.id));
      li.append(b); q.append(li);
      const o = document.createElement("option"); o.value = m.id; o.textContent = `${m.game} · level ${m.level} (${m.tries} tries)`;
      if (state.cur && state.cur.id === m.id) o.selected = true;
      sel.append(o);
    }
  }

  // ---------------------------------------------------------------- big view
  function seq() {
    const m = state.cur;
    if (state.focus < 0) return { frames: m.pf, names: m.prefix.names, levels: m.prefix.levels, turns: m.prefix.turns, base: 0 };
    const c = m.candidates[state.focus];
    const lastLevel = m.prefix.levels[m.prefix.levels.length - 1];
    return {
      frames: m.pf.concat(c.fr), names: m.prefix.names.concat(c.names),
      levels: m.prefix.levels.concat(c.levels.length ? c.levels : c.names.map(() => lastLevel)),
      turns: m.prefix.turns.concat(c.turns.map(t => Object.assign({}, t, { at: t.at + m.pf.length, live: true }))),
      base: m.pf.length };
  }
  function show(pos) {
    const s = seq();
    state.pos = Math.max(0, Math.min(pos, s.frames.length - 1));
    state.paintBig(s.frames[state.pos]);
    $("#scrub").value = state.pos;
    const m = state.cur, forkIdx = m.pf.length - 1;
    const after = state.pos > forkIdx;
    const actionNo = state.pos === 0 ? 0 : (after ? m.fork_action + (state.pos - m.pf.length) : state.pos);
    const ro = $("#readout"); ro.textContent = "";
    const add = (k, v) => { const sp = document.createElement("span"); const b = document.createElement("b"); b.textContent = k; sp.append(b, " " + v); ro.append(sp); };
    add("Action", state.pos === 0 ? "start" : String(actionNo));
    add("Move", s.names[state.pos] || "");
    add("Level", String(s.levels[state.pos] || m.level));
    add(after ? "In" : "Where", after ? m.candidates[state.focus].label : (state.pos === forkIdx ? "the decision point" : "before the decision point"));
    let turn = null;
    for (const t of s.turns) { if (t.at <= state.pos) turn = t; else break; }
    $("#think-label").textContent = turn ? `Model's thinking · turn ${turn.step}${turn.live ? " (this try)" : ""}` : "Model's thinking";
    $("#think-first").textContent = turn && turn.first ? turn.first : "No thinking recorded before this action.";
    const hasLast = !!(turn && turn.last);
    $("#think-last-label").hidden = !hasLast; $("#think-last").hidden = !hasLast;
    $("#think-last").textContent = hasLast ? turn.last : "";
  }
  function setupTimeline() {
    const s = seq(), m = state.cur, sc = $("#scrub");
    sc.max = String(s.frames.length - 1);
    const ticks = $("#ticks"); ticks.textContent = "";
    const n = Math.max(1, s.frames.length - 1);
    const place = (i, cls, text) => {
      const t = document.createElement("div"); t.className = "tick " + cls; t.style.left = `${(i / n) * 100}%`; ticks.append(t);
      if (text) { const l = document.createElement("div"); l.className = "tick-label"; l.style.left = `${(i / n) * 100}%`; l.textContent = text; ticks.append(l); }
    };
    m.prefix.clears.forEach(i => place(i, "", ""));
    place(m.pf.length - 1, "fork", state.focus >= 0 ? "decision" : "");
  }
  function stopPlay() { if (state.playing) { cancelAnimationFrame(state.playing); state.playing = null; } }
  function replay() {
    stopPlay();
    const s = seq(), m = state.cur;
    const from = state.focus >= 0 ? m.pf.length - 1 : ($("#from-start").checked ? 0 : m.level_start);
    const to = s.frames.length - 1;
    if (reduceMotion) { show(to); return; }
    const total = state.focus >= 0 ? Math.min(6000, Math.max(1500, (to - from) * 120)) : 3000;
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / total);
      show(Math.round(from + k * (to - from)));
      state.playing = k < 1 ? requestAnimationFrame(tick) : null;
    };
    state.playing = requestAnimationFrame(tick);
  }

  // ---------------------------------------------------------------- candidates
  function renderCands() {
    const m = state.cur, box = $("#cands");
    box.textContent = "";
    const tallies = tally(m.id);
    const revealed = state.mine.has(m.id);
    m.candidates.forEach((c, i) => {
      const card = document.createElement("div");
      card.className = "card" + (state.focus === i ? " focus" : "") + (state.pick === c.id ? " picked" : "");
      const mini = document.createElement("button"); mini.className = "mini"; mini.setAttribute("aria-label", `Watch ${c.label} in the big frame`);
      const cv = document.createElement("canvas"); cv.width = 192; cv.height = 192; mini.append(cv);
      mini.addEventListener("click", () => focusCand(i));
      c.paint = painter(cv, m.palette);
      c.paint(c.fr[c.fr.length - 1] || m.pf[m.pf.length - 1]);
      const head = document.createElement("div"); head.className = "card-head";
      const nm = document.createElement("span"); nm.className = "card-name"; nm.textContent = `${i + 1}. ${c.label}`;
      const pill = document.createElement("span");
      if (c.kind === "source") { pill.className = "pill src"; pill.textContent = c.cleared ? `cleared in ${c.actions}` : `${c.actions} actions`; }
      else if (c.cleared) { pill.className = "pill good"; pill.textContent = `cleared in ${c.actions}`; }
      else { pill.className = "pill warn"; pill.textContent = "not cleared"; }
      head.append(nm, pill);
      const sub = document.createElement("div"); sub.className = "card-sub";
      const plan = (c.turns[0] && c.turns[0].first) || "";
      sub.textContent = c.cleared ? (m.human ? `human level: ${m.human} actions` : "level cleared") :
        `${c.actions} actions` + (c.stop ? `, stopped: ${({ turn_cap: "turn limit", token_cap: "thinking limit", clock: "out of time" })[c.stop] || c.stop}` : "");
      sub.title = plan;
      const acts = document.createElement("div"); acts.className = "card-actions";
      const pk = document.createElement("button"); pk.className = "btn pick"; pk.textContent = state.pick === c.id ? "Picked" : "Pick";
      pk.setAttribute("aria-pressed", state.pick === c.id ? "true" : "false");
      pk.addEventListener("click", () => { state.pick = state.pick === c.id ? null : c.id; state.flags.delete(c.id); markDirty(); renderCands(); });
      const fl = document.createElement("button"); fl.className = "btn flag"; fl.textContent = "Bad";
      fl.title = "This try does something a good player would not";
      fl.setAttribute("aria-pressed", state.flags.has(c.id) ? "true" : "false");
      fl.addEventListener("click", () => { state.flags.has(c.id) ? state.flags.delete(c.id) : state.flags.add(c.id); if (state.pick === c.id) state.pick = null; markDirty(); renderCands(); });
      acts.append(pk, fl);
      const t = document.createElement("div"); t.className = "tally";
      const n = tallies.picks.get(c.id) || 0, f = tallies.flags.get(c.id) || 0;
      t.textContent = revealed ? [n ? `${n} pick${n > 1 ? "s" : ""}` : "", f ? `${f} bad` : ""].filter(Boolean).join(" · ") : "";
      card.append(mini, head, sub, acts, t);
      box.append(card);
    });
    $("#b-none").setAttribute("aria-pressed", state.pick === "none" ? "true" : "false");
    $("#b-none").classList.toggle("primary", state.pick === "none");
    $("#b-save").disabled = !state.writable || !state.db || !state.uid || !(state.pick || state.flags.size || $("#note").value.trim());
  }
  function playMinis() {
    if (state.minis) { cancelAnimationFrame(state.minis); state.minis = null; $("#b-playall").textContent = "Play all tries"; return; }
    const m = state.cur; const t0 = performance.now(); const step = 140;
    const longest = Math.max(...m.candidates.map(c => c.fr.length));
    $("#b-playall").textContent = "Stop";
    const tick = now => {
      const k = Math.floor((now - t0) / step);
      m.candidates.forEach(c => c.paint(c.fr[Math.min(k, c.fr.length - 1)]));
      if (k < longest + 6) state.minis = requestAnimationFrame(tick);
      else { state.minis = null; $("#b-playall").textContent = "Play all tries"; }
    };
    state.minis = requestAnimationFrame(tick);
  }
  function focusCand(i) {
    state.focus = state.focus === i ? -1 : i;
    setupTimeline(); renderCands();
    if (state.focus >= 0) replay(); else show(state.cur.pf.length - 1);
  }

  // ---------------------------------------------------------------- labels
  function tally(mid) {
    const picks = new Map(), flags = new Map();
    for (const l of state.labels.values()) {
      if (l.moment !== mid) continue;
      if (l.pick) picks.set(l.pick, (picks.get(l.pick) || 0) + 1);
      for (const f of l.flags || []) flags.set(f, (flags.get(f) || 0) + 1);
    }
    return { picks, flags };
  }
  function markDirty() { state.dirty = true; $("#save-status").textContent = ""; $("#save-status").className = "status"; }
  async function save() {
    const m = state.cur, st = $("#save-status");
    if (!state.db || !state.uid) return;
    const body = { moment: m.id, moment_id: m.moment_id, game: m.game, level: m.level, pick: state.pick || null,
      flags: [...state.flags], note: $("#note").value.trim().slice(0, 2000), reviewer: state.uid,
      candidates: m.candidates.map(c => c.id), at: new Date().toISOString() };
    $("#b-save").disabled = true; st.className = "status"; st.textContent = "Saving…";
    try {
      await state.db.collection("labels").doc(labelKey(m.id, state.uid)).set(body);
      state.dirty = false; st.className = "status ok";
      st.textContent = "Saved. Other reviewers' picks for this moment are now shown on the cards.";
    } catch (e) {
      st.className = "status err";
      if (e && e.code === "invalid_argument") { state.writable = false; st.textContent = "This page is view-only for you, so picks can't be saved. Ask the owner for Contributor access."; }
      else if (e && e.code === "quota_exceeded") st.textContent = "The review store is full. Tell the owner.";
      else st.textContent = "Couldn't save just now. Try again in a moment.";
    }
    renderCands();
  }
  function loadMine(m) {
    const l = state.mine.get(m.id);
    state.pick = l ? l.pick : null; state.flags = new Set(l ? l.flags || [] : []);
    $("#note").value = l ? l.note || "" : "";
    state.dirty = false;
  }

  // ---------------------------------------------------------------- moment
  async function openMoment(id) {
    stopPlay(); if (state.minis) { cancelAnimationFrame(state.minis); state.minis = null; }
    let m;
    try { m = await loadMoment(id); } catch (e) { $("#main").textContent = "Couldn't load this moment. Reload the page."; return; }
    state.cur = m; state.focus = -1;
    const main = $("#main"); main.textContent = "";
    main.append($("#tpl-moment").content.cloneNode(true));
    $('[data-f="game"]').textContent = m.game;
    $('[data-f="level"]').textContent = String(m.level);
    const tries = m.candidates.filter(c => c.kind === "try");
    $('[data-f="sub"]').textContent = `decision at action ${m.fork_action} · ${tries.length} tries, ${tries.filter(c => c.cleared).length} cleared` +
      (m.human ? ` · a human clears this level in ${m.human} actions` : "");
    state.paintBig = painter($("#big"), m.palette);
    setupTimeline();
    loadMine(m);
    renderCands();
    renderQueue();
    $("#scrub").addEventListener("input", e => { stopPlay(); show(+e.target.value); });
    $("#b-start").addEventListener("click", () => { stopPlay(); show(state.focus >= 0 ? m.pf.length - 1 : m.level_start); });
    $("#b-prev").addEventListener("click", () => { stopPlay(); show(state.pos - 1); });
    $("#b-next").addEventListener("click", () => { stopPlay(); show(state.pos + 1); });
    $("#b-end").addEventListener("click", () => { stopPlay(); show(seq().frames.length - 1); });
    $("#b-play").addEventListener("click", replay);
    $("#from-start").addEventListener("change", replay);
    $("#b-playall").addEventListener("click", playMinis);
    $("#b-none").addEventListener("click", () => { state.pick = state.pick === "none" ? null : "none"; markDirty(); renderCands(); });
    $("#b-save").addEventListener("click", save);
    $("#note").addEventListener("input", () => { markDirty(); renderCands(); });
    if (!state.db) { $("#save-status").textContent = "Picks are saved in the published page, for signed-in reviewers."; }
    show(m.level_start);
    replay();
  }

  // ---------------------------------------------------------------- keys
  document.addEventListener("keydown", e => {
    if (!state.cur || e.target.closest("textarea, input[type=text], select")) return;
    if (e.key === " ") { e.preventDefault(); replay(); }
    else if (e.key === "ArrowLeft") { stopPlay(); show(state.pos - 1); }
    else if (e.key === "ArrowRight") { stopPlay(); show(state.pos + 1); }
    else if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < state.cur.candidates.length) focusCand(i); }
    else if (e.key === "p" && state.focus >= 0) { const c = state.cur.candidates[state.focus]; state.pick = c.id; state.flags.delete(c.id); markDirty(); renderCands(); }
  });

  // ---------------------------------------------------------------- boot
  function setFilter(f) {
    state.filter = f;
    $("#f-todo").setAttribute("aria-pressed", f === "todo" ? "true" : "false");
    $("#f-all").setAttribute("aria-pressed", f === "all" ? "true" : "false");
    renderQueue();
  }
  $("#f-todo").addEventListener("click", () => setFilter("todo"));
  $("#f-all").addEventListener("click", () => setFilter("all"));
  $("#mobile-pick").addEventListener("change", e => openMoment(e.target.value));

  async function connect() {
    const [db, user] = await Promise.all([
      window.claude ? window.claude.use("db").catch(() => null) : null,
      window.claude ? window.claude.use("user").catch(() => null) : null]);
    const who = $("#who");
    if (!db || !user) { who.textContent = "Viewing without saving: open the published page signed in to pick."; return; }
    const uid = await user.id();
    if (!uid) { who.textContent = "Sign in to save picks."; return; }
    state.db = db; state.uid = uid;
    const me = await user.me();
    who.textContent = me && me.name ? `Reviewing as ${me.name}` : "Reviewing (signed in)";
    const canWrite = await user.can("data.write");
    if (canWrite === false) { state.writable = false; who.textContent += " · view-only"; }
    db.collection("labels").onSnapshot(snap => {
      state.labels = new Map(); state.mine = new Map();
      snap.docs.forEach(d => { const v = d.data(); if (!v) return; state.labels.set(d.id, v); if (v.reviewer === uid) state.mine.set(v.moment, v); });
      renderQueue();
      if (state.cur) { if (!state.dirty) loadMine(state.cur); renderCands(); }
    }, () => { who.textContent += " · picks are not updating, reload to retry"; });
    if (state.cur) renderCands();
  }

  (async () => {
    try { state.index = await loadIndex(); }
    catch (e) { $("#main").textContent = "Couldn't load the moment list. Reload the page."; return; }
    if (!state.index.length) { $("#loading").textContent = "No moments to review yet."; return; }
    connect();
    renderQueue();
    openMoment(state.index[0].id);
  })();
})();
</script>
